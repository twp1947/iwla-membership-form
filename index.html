<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .checkbox-group label {
            display: inline;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        @media print {
            button {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Membership Application</h2>
        <form>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="address">Address or PO Box</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" name="state" required>
            </div>
            <div class="form-group">
                <label for="zip">ZIP</label>
                <input type="text" id="zip" name="zip" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="sponsor">Sponsor</label>
                <input type="text" id="sponsor" name="sponsor">
            </div>
            <div class="form-group">
                <label>Membership Type</label>
                <label><input type="radio" name="membership" value="Regular (Local Family)" required> Regular (Local Family) - $110.00</label><br>
                <label><input type="radio" name="membership" value="Family (National)"> Family (National) - $135.00</label><br>
                <label><input type="radio" name="membership" value="Student"> Student - $55.00 (up to age 21)  Date of Birth ___________ </label>
            </div>
            <div class="form-group">
                <label for="amount">Amount Enclosed ($)</label>
                <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
            </div>
            <div class="form-group">
                
               
            </div>
            <div class="form-group">
                <label>Volunteer Interests</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="volunteer" value="Gun Range Upkeep and Maintenance"> Gun Range Upkeep and Maintenance</label><br>
                    <label><input type="checkbox" name="volunteer" value="Hunter Safety Program"> Hunter Safety Program</label><br>
                    <label><input type="checkbox" name="volunteer" value="Spring and Fall Clean-up Days"> Spring and Fall Clean-up Days</label><br>
                    <label><input type="checkbox" name="volunteer" value="Serve on Board of Directors"> Serve on Board of Directors</label><br>
                    <label><input type="checkbox" name="volunteer" value="Christmas Tree Sales"> Christmas Tree Sales</label><br>
                    <label><input type="checkbox" name="volunteer" value="Kids Fishing Derby"> Kids Fishing Derby</label>
                </div>
            </div>
            <div class="form-group">
                <label>How did you hear about us?</label>
                <label><input type="radio" name="referral" value="Friend"> Friend</label>
                <label><input type="radio" name="referral" value="Ike Member"> Ike Member</label>
                <label><input type="radio" name="referral" value="Newspaper Ad"> Newspaper Ad</label>
                <label><input type="radio" name="referral" value="Web Site"> Web Site</label>
            </div> 
            <label> Return  the form to Izaak Walton League, P.O.Box 327, Marshalltown, Ia 50158 </label>
            <button type="button" onclick="window.print()">Print Form</button>
        </form>
    </div>
</body>
</html>
  </script>
</body>
</html>
